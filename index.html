<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WaveDose — Documentos Legais & Suporte</title>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0B0F17;
      color: #F9FAFB;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #161E2E;
      border: 1px solid #1F2937;
      border-radius: 20px;
      padding: 36px;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    h1 { font-size: 24px; margin-top: 16px; margin-bottom: 8px; }
    p { color: #9CA3AF; font-size: 14px; margin-bottom: 28px; line-height: 1.5; }
    .btn {
      display: block;
      background: #10B981;
      color: #000;
      font-weight: bold;
      text-decoration: none;
      padding: 14px 20px;
      border-radius: 12px;
      margin-bottom: 12px;
      font-size: 15px;
      transition: opacity 0.2s;
    }
    .btn.secondary {
      background: transparent;
      color: #F9FAFB;
      border: 1px solid #1F2937;
    }
    .btn:hover { opacity: 0.9; }
    .support { margin-top: 24px; font-size: 12px; color: #6B7280; }
    .support a { color: #10B981; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <img src="icons/Icon-192.png" width="64" height="64" style="border-radius: 14px;" alt="Logo WaveDose">
    <h1>WaveDose: GLP-1 &amp; Dose Tracker</h1>
    <p>Central oficial de conformidade, termos e transparência de privacidade para a Apple App Store e Google Play.</p>
    
    <a href="privacy.html" class="btn">Política de Privacidade</a>
    <a href="terms.html" class="btn secondary">Termos de Uso (EULA)</a>

    <div class="support">
      Suporte técnico: <a href="mailto:suporte@mayrincktech.com">suporte@mayrincktech.com</a><br>
      Desenvolvido por MayrinckTech
    </div>
  </div>
</body>
</html>
